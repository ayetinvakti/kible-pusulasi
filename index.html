<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıble Pusulası | Ayetin Vakti</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Pusula Alanı */
        .compass-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .compass-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 4px solid #334155;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s ease-out, border-color 0.3s ease;
        }

        /* Kıbleye Hizalanınca Pusula Çerçevesi Parlasın */
        .compass-circle.aligned {
            border-color: var(--accent-color);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        /* Yön Harfleri */
        .direction {
            position: absolute;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .direction.n { top: 10px; left: 50%; transform: translateX(-50%); color: #ef4444; }
        .direction.e { right: 15px; top: 50%; transform: translateY(-50%); }
        .direction.s { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .direction.w { left: 15px; top: 50%; transform: translateY(-50%); }

        /* Kıble İbresi */
        .qibla-pointer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 90px solid var(--accent-color);
            position: absolute;
            top: 30px;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
        }

        .kaaba-icon {
            position: absolute;
            top: 5px;
            font-size: 1.5rem;
        }

        .center-dot {
            width: 16px;
            height: 16px;
            background-color: var(--accent-color);
            border-radius: 50%;
            z-index: 10;
            border: 2px solid var(--bg-color);
        }

        /* Bilgi Kartları */
        .info-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }

        .info-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .btn-permission {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }

        .footer {
            margin-top: auto;
            padding-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Kıble Pusulası</h1>
        <p id="status-text">Konum ve pusula izni bekleniyor...</p>
    </div>

    <!-- Pusula Alanı -->
    <div class="compass-wrapper">
        <div class="compass-circle" id="compass">
            <span class="direction n">K</span>
            <span class="direction e">D</span>
            <span class="direction s">G</span>
            <span class="direction w">B</span>
        </div>
        <div class="qibla-pointer" id="qibla-pointer">
            <div class="kaaba-icon">🕋</div>
            <div class="pointer-arrow"></div>
        </div>
        <div class="center-dot"></div>
    </div>

    <!-- İzin ve Başlatma Butonu -->
    <button class="btn-permission" id="perm-btn" onclick="requestCompassPermission()">Pusulayı ve Sesi Etkinleştir</button>

    <!-- Derece ve Detay Kartı -->
    <div class="info-card">
        <div class="info-title">Kıble Açınız</div>
        <div class="info-value" id="qibla-angle">--°</div>
    </div>

    <div class="footer">
        <p>Ayetin Vakti • Titreşim & Ses Destekli</p>
    </div>
</div>

<script>
    let qiblaBearing = 0;
    let isAligned = false; // Kıbleye hizalandı mı?
    let audioCtx = null;

    const meccaLat = 21.4225;
    const meccaLng = 39.8262;

    // Web Audio API ile Dosyasız Bip Sesi Üretici
    function playBeep() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880 Hz tatlı ton
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {
            console.log("Ses çalınamadı:", e);
        }
    }

    // Konum Bilgisi Al
    function initLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    qiblaBearing = calculateQiblaAngle(userLat, userLng);
                    
                    document.getElementById('qibla-angle').innerText = Math.round(qiblaBearing) + '°';
                    document.getElementById('status-text').innerText = "Cihazınızı düz tutun";

                    setupCompass();
                },
                (error) => {
                    document.getElementById('status-text').innerText = "Konum alınamadı. Lütfen konum izni verin.";
                }
            );
        } else {
            document.getElementById('status-text').innerText = "Tarayıcınız konum özelliğini desteklemiyor.";
        }
    }

    // Kıble Açısını Hesapla
    function calculateQiblaAngle(lat, lng) {
        const phiK = meccaLat * Math.PI / 180;
        const lambdaK = meccaLng * Math.PI / 180;
        const phi = lat * Math.PI / 180;
        const lambda = lng * Math.PI / 180;

        const qibla = Math.atan2(
            Math.sin(lambdaK - lambda),
            Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda)
        );

        return (qibla * 180 / Math.PI + 360) % 360;
    }

    // Pusula Sensörünü Başlat
    function setupCompass() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            document.getElementById('perm-btn').style.display = 'block';
        } else {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
    }

    function requestCompassPermission() {
        // Kullanıcı etkileşimi ile ses motorunu uyandır
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    document.getElementById('perm-btn').style.display = 'none';
                    window.addEventListener('deviceorientation', handleOrientation, true);
                } else {
                    alert('Pusulayı kullanabilmek için sensör izni vermeniz gerekmektedir.');
                }
            })
            .catch(console.error);
    }

    // Cihaz Döndükçe Pusulayı Kontrol Et
    function handleOrientation(event) {
        let heading = event.alpha;

        if (event.webkitCompassHeading) {
            heading = event.webkitCompassHeading;
        } else if (event.absolute && event.alpha !== null) {
            heading = 360 - event.alpha;
        }

        if (heading !== undefined && heading !== null) {
            document.getElementById('compass').style.transform = `rotate(${-heading}deg)`;
            
            const qiblaRotation = qiblaBearing - heading;
            document.getElementById('qibla-pointer').style.transform = `rotate(${qiblaRotation}deg)`;

            // --- KIBLEYE HİZALANMA KONTROLÜ ---
            // Derece farkı ±4 dereceye girdi mi?
            let diff = Math.abs((heading - qiblaBearing + 360) % 360);
            if (diff > 180) diff = 360 - diff;

            const compassElem = document.getElementById('compass');

            if (diff <= 4) {
                if (!isAligned) {
                    isAligned = true;
                    compassElem.classList.add('aligned');
                    document.getElementById('status-text').innerText = "✨ Kıble Yönündesiniz ✨";

                    // Titreşim Ver (Destekleyen Cihazlarda)
                    if (navigator.vibrate) {
                        navigator.vibrate([150, 50, 150]); // İki kısa titreşim
                    }

                    // Onay Sesi Çal
                    playBeep();
                }
            } else {
                if (isAligned) {
                    isAligned = false;
                    compassElem.classList.remove('aligned');
                    document.getElementById('status-text').innerText = "Cihazınızı düz tutun";
                }
            }
        }
    }

    window.onload = initLocation;
</script>

</body>
</html>
