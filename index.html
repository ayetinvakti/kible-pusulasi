<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Kıble Pusulası | Ayetin Vakti</title>
    
    <meta property="og:title" content="Kıble Pusulası | Ayetin Vakti">
    <meta property="og:description" content="Hassas pusula, titreşim ve sesli onay desteğiyle Kıble yönünüzü kolayca bulun.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
            position: relative;
        }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover, .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        /* Üst Açı Bilgi Paneli (Örnek Resimdeki Gibi Yan Yana) */
        .top-stats {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            margin-bottom: 10px;
        }

        .stat-item {
            text-align: left;
        }

        .stat-item:last-child {
            text-align: right;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .stat-value span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Yeni Nesil Pusula Alanı */
        .compass-wrapper {
            position: relative;
            width: 290px;
            height: 290px;
            margin: 10px 0 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Arka plandaki şık ışık/gradient halka efekti */
        .compass-bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent-color) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.15;
            z-index: 0;
        }

        .compass-circle {
            width: 275px;
            height: 275px;
            border-radius: 50%;
            background-color: var(--card-bg);
            position: relative;
            box-shadow: var(--shadow), inset 0 0 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease-out;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            z-index: 1;
        }

        /* Kadran üzerindeki çizgiler ve harfler */
        .compass-tick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            height: 100%;
            transform-origin: center;
            pointer-events: none;
        }
        
        .compass-tick::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 0;
            width: 2px;
            height: 8px;
            background-color: var(--border-color);
        }

        .direction {
            position: absolute;
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-muted);
            z-index: 2;
        }

        .direction.n { top: 12px; left: 50%; transform: translateX(-50%); color: #ef4444; }
        .direction.e { right: 16px; top: 50%; transform: translateY(-50%); }
        .direction.s { bottom: 12px; left: 50%; transform: translateX(-50%); }
        .direction.w { left: 16px; top: 50%; transform: translateY(-50%); }

        /* Ortadaki Kâbe İkonlu Sabit Yuva (Örnek Resimdeki Gibi) */
        .compass-center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background-color: var(--card-bg);
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .compass-center-hub .kaaba-hub-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 5px var(--accent-color));
        }

        /* Kıble Yönü Ok İşareti (Dönen veya Konumlanan) */
        .qibla-pointer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
            z-index: 5;
            pointer-events: none;
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 95px solid var(--accent-color);
            position: absolute;
            top: 18px;
            filter: drop-shadow(0 0 6px var(--accent-color));
        }

        /* Alt Durum Butonu ve Bilgi Kartları */
        .status-button-card {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            width: 85%;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .status-button-card.aligned {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .info-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--shadow);
        }

        .info-title {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .info-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .btn-permission {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            width: 100%;
        }

        .footer {
            margin-top: auto;
            padding-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </div>

    <!-- Üst Bilgi Alanı (Örnek Görsel Düzeni) -->
    <div class="top-stats">
        <div class="stat-item">
            <div class="stat-label" data-i18n="label_current">Mevcut Yön</div>
            <div class="stat-value" id="current-angle">--° <span id="current-dir-code">--</span></div>
        </div>
        <div class="stat-item">
            <div class="stat-label" data-i18n="label_qibla">Kıble Yönü</div>
            <div class="stat-value" id="qibla-angle-top">--°</div>
        </div>
    </div>

    <!-- Pusula Tasarımı -->
    <div class="compass-wrapper">
        <div class="compass-bg-glow"></div>
        <div class="compass-circle" id="compass">
            <!-- Kadran Çizgileri -->
            <div class="compass-tick" style="transform: rotate(30deg);"></div>
            <div class="compass-tick" style="transform: rotate(60deg);"></div>
            <div class="compass-tick" style="transform: rotate(120deg);"></div>
            <div class="compass-tick" style="transform: rotate(150deg);"></div>
            <div class="compass-tick" style="transform: rotate(210deg);"></div>
            <div class="compass-tick" style="transform: rotate(240deg);"></div>
            <div class="compass-tick" style="transform: rotate(300deg);"></div>
            <div class="compass-tick" style="transform: rotate(330deg);"></div>

            <span class="direction n" data-i18n="dir_n">K</span>
            <span class="direction e" data-i18n="dir_e">D</span>
            <span class="direction s" data-i18n="dir_s">G</span>
            <span class="direction w" data-i18n="dir_b">B</span>
        </div>

        <!-- Kıbleyi Gösteren Ok -->
        <div class="qibla-pointer" id="qibla-pointer">
            <div class="pointer-arrow"></div>
        </div>

        <!-- Ortadaki Sabit Kâbe Yuvası -->
        <div class="compass-center-hub">
            <div class="kaaba-hub-icon">🕋</div>
        </div>
    </div>

    <!-- Durum Çubuğu (Örnekteki gibi hap buton) -->
    <div class="status-button-card" id="status-card">
        <span id="status-text" data-i18n="status_waiting">Konum ve pusula izni bekleniyor...</span>
    </div>

    <button class="btn-permission" id="perm-btn" onclick="requestCompassPermission()" data-i18n="btn_permission">Pusulayı ve Sesi Etkinleştir</button>

    <!-- Mesafe Kartı -->
    <div class="info-card">
        <span style="font-size: 1.3rem;">🕋</span>
        <div>
            <span class="info-title" data-i18n="info_distance_title">Kâbe'ye Uzaklık:</span>
            <span class="info-value" id="kaaba-distance">-- km</span>
        </div>
    </div>

    <div class="footer">
        <p data-i18n="footer_text">Ayetin Vakti • Titreşim & Ses Destekli</p>
    </div>
</div>

<script>
    const translations = {
        tr: {
            page_title: "Kıble Pusulası | Ayetin Vakti",
            label_current: "Mevcut Yön",
            label_qibla: "Kıble Yönü",
            status_waiting: "Konum ve pusula izni bekleniyor...",
            status_flat: "Cihazınızı düz tutun",
            status_aligned: "Kıble Yönündesiniz",
            status_no_location: "Konum alınamadı. Lütfen konum izni verin.",
            status_no_support: "Tarayıcınız konum özelliğini desteklemiyor.",
            status_sensor_err: "Pusulayı kullanabilmek için sensör izni vermeniz gerekmektedir.",
            btn_permission: "Pusulayı ve Sesi Etkinleştir",
            info_distance_title: "Kâbe'ye Uzaklık",
            footer_text: "Ayetin Vakti • Titreşim & Ses Destekli",
            dir_n: "K", dir_e: "D", dir_s: "G", dir_b: "B"
        },
        en: {
            page_title: "Qibla Compass | Ayetin Vakti",
            label_current: "Current Direction",
            label_qibla: "Qibla Direction",
            status_waiting: "Waiting for location and compass permission...",
            status_flat: "Keep your device flat",
            status_aligned: "You are facing the Qibla",
            status_no_location: "Could not get location. Please allow location access.",
            status_no_support: "Your browser does not support geolocation.",
            status_sensor_err: "Sensor permission is required to use the compass.",
            btn_permission: "Enable Compass & Audio",
            info_distance_title: "Distance to Kaaba",
            footer_text: "Ayetin Vakti • Vibration & Audio Supported",
            dir_n: "N", dir_e: "E", dir_s: "S", dir_b: "W"
        },
        ar: {
            page_title: "بوصلة القبلة | آية الوقت",
            label_current: "الأتجاه الحالي",
            label_qibla: "اتجاه القبلة",
            status_waiting: "جاري انتظار إذن الموقع والبوصلة...",
            status_flat: "اجعل هاتفك مستوياً",
            status_aligned: "أنت في اتجاه القبلة",
            status_no_location: "تعذر الحصول على الموقع. يرجى السماح بالوصول للموقع.",
            status_no_support: "متصفحك لا يدعم خاصية تحديد الموقع.",
            status_sensor_err: "مطلوب إذن المستشعر لاستخدام البوصلة.",
            btn_permission: "تفعيل البوصلة والصوت",
            info_distance_title: "المسافة إلى الكعبة",
            footer_text: "آية الوقت • يدعم الاهتزاز والصوت",
            dir_n: "ش", dir_e: "ق", dir_s: "ج", dir_b: "غ"
        }
    };

    let qiblaBearing = 0;
    let isAligned = false; 
    let audioCtx = null;

    const meccaLat = 21.4225;
    const meccaLng = 39.8262;

    const themeBtn = document.getElementById('theme-btn');

    function updateThemeButton(isLight) {
        if (themeBtn) {
            themeBtn.textContent = isLight ? '☀️' : '🌙';
        }
    }

    function setTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        setTheme(!isLight);
    }

    const savedThemeInitial = localStorage.getItem('theme');
    const systemPrefersDarkInitial = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLightInitial = (savedThemeInitial === 'light') || (!savedThemeInitial && !systemPrefersDarkInitial);

    if (isLightInitial) {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
    } else {
        document.documentElement.classList.remove('light-mode');
        document.body.classList.remove('light-mode');
    }
    updateThemeButton(isLightInitial);

    function playBeep() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {
            console.log("Ses çalınamadı:", e);
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
    }

    function getDirectionText(degrees) {
        const directions = ['K', 'KD', 'D', 'GD', 'G', 'GB', 'B', 'KB'];
        const index = Math.round((degrees % 360) / 45);
        return directions[index % 8];
    }

    function initLocation() {
        const t = translations[currentLang] || translations['tr'];
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    qiblaBearing = calculateQiblaAngle(userLat, userLng);
                    const distanceToKaaba = calculateDistance(userLat, userLng, meccaLat, meccaLng);
                    
                    document.getElementById('qibla-angle-top').innerText = Math.round(qiblaBearing) + '°';
                    document.getElementById('kaaba-distance').innerText = distanceToKaaba.toLocaleString() + ' km';
                    document.getElementById('status-text').innerText = t.status_flat;

                    setupCompass();
                },
                (error) => {
                    document.getElementById('status-text').innerText = t.status_no_location;
                }
            );
        } else {
            document.getElementById('status-text').innerText = t.status_no_support;
        }
    }

    function calculateQiblaAngle(lat, lng) {
        const phiK = meccaLat * Math.PI / 180;
        const lambdaK = meccaLng * Math.PI / 180;
        const phi = lat * Math.PI / 180;
        const lambda = lng * Math.PI / 180;

        const qibla = Math.atan2(
            Math.sin(lambdaK - lambda),
            Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda)
        );

        return (qibla * 180 / Math.PI + 360) % 360;
    }

    function setupCompass() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            document.getElementById('perm-btn').style.display = 'block';
        } else {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
    }

    function requestCompassPermission() {
        const t = translations[currentLang] || translations['tr'];
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    document.getElementById('perm-btn').style.display = 'none';
                    window.addEventListener('deviceorientation', handleOrientation, true);
                } else {
                    alert(t.status_sensor_err);
                }
            })
            .catch(console.error);
    }

    function handleOrientation(event) {
        let heading = event.alpha;

        if (event.webkitCompassHeading) {
            heading = event.webkitCompassHeading;
        } else if (event.absolute && event.alpha !== null) {
            heading = 360 - event.alpha;
        }

        if (heading !== undefined && heading !== null) {
            const normalizedHeading = (heading + 360) % 360;
            
            // Üst kısımdaki mevcut yön göstergesini güncelle
            document.getElementById('current-angle').firstChild.nodeValue = Math.round(normalizedHeading) + '° ';
            document.getElementById('current-dir-code').innerText = getDirectionText(normalizedHeading);

            // Pusulayı döndür
            document.getElementById('compass').style.transform = `rotate(${-heading}deg)`;
            
            const qiblaRotation = qiblaBearing - heading;
            document.getElementById('qibla-pointer').style.transform = `rotate(${qiblaRotation}deg)`;

            let diff = Math.abs((heading - qiblaBearing + 360) % 360);
            if (diff > 180) diff = 360 - diff;

            const statusCard = document.getElementById('status-card');
            const t = translations[currentLang] || translations['tr'];

            if (diff <= 4) {
                if (!isAligned) {
                    isAligned = true;
                    statusCard.classList.add('aligned');
                    document.getElementById('status-text').innerText = "✨ " + t.status_aligned + " ✨";

                    if (navigator.vibrate) {
                        navigator.vibrate([150, 50, 150]);
                    }

                    playBeep();
                }
            } else {
                if (isAligned) {
                    isAligned = false;
                    statusCard.classList.remove('aligned');
                    document.getElementById('status-text').innerText = t.status_flat;
                }
            }
        }
    }

    window.onload = () => {
        if (translations[currentLang]) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    if (element.tagName === 'TITLE') {
                        document.title = translations[currentLang][key];
                    } else {
                        element.textContent = translations[currentLang][key];
                    }
                }
            });
        }

        initLocation();
    };
</script>

</body>
</html>
