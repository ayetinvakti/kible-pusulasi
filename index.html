<!DOCTYPE html>
<html lang="tr">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Tema ve Özel Renk Paleti Kontrolü (Sayfa yüklenmeden önce çalışır, titremeyi önler)
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
        }

        // Ayarlardan kaydedilen özel renkleri hemen uygula
        const savedAccent = localStorage.getItem('custom_accent');
        const savedBg = localStorage.getItem('custom_bg');
        const savedText = localStorage.getItem('custom_text');

        if (savedAccent) document.documentElement.style.setProperty('--accent-color', savedAccent);
        if (savedBg) {
            document.documentElement.style.setProperty('--bg-color', savedBg);
            document.documentElement.style.setProperty('--card-bg', savedBg);
        }
        if (savedText) document.documentElement.style.setProperty('--text-color', savedText);

        // Dil yönü ayarı (RTL / LTR)
        const currentLang = localStorage.getItem('user_lang') || 'tr';
        if (currentLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="page_title">Kıble Pusulası | Ayetin Vakti</title>
    
    <!-- Sosyal Medya & Mesajlaşma Önizleme Etiketleri -->
    <meta property="og:title" content="Kıble Pusulası | Ayetin Vakti">
    <meta property="og:description" content="Hassas pusula, titreşim ve sesli onay desteğiyle Kıble yönünüzü kolayca bulun.">
    <meta property="og:type" content="website">

    <style>
        /* Gece Teması (Varsayılan Koyu Mode) */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Gündüz Teması (Açık Mode) */
        html.light-mode, body.light-mode {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-color: #059669;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --btn-bg: #f1f5f9;
            --btn-hover: #e2e8f0;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar & Yuvarlak Buton Düzeni */
        .navbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            position: relative;
        }

        .home-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .home-btn:hover {
            background-color: var(--btn-hover);
        }

        .theme-icon-btn {
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-icon-btn:hover {
            background-color: var(--btn-hover);
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Pusula Alanı */
        .compass-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 15px 0 25px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .compass-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            position: relative;
            box-shadow: var(--shadow);
            transition: transform 0.1s ease-out, border-color 0.3s ease;
        }

        .compass-circle.aligned {
            border-color: var(--accent-color);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .direction {
            position: absolute;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .direction.n { top: 10px; left: 50%; transform: translateX(-50%); color: #ef4444; }
        .direction.e { right: 15px; top: 50%; transform: translateY(-50%); }
        .direction.s { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .direction.w { left: 15px; top: 50%; transform: translateY(-50%); }

        .qibla-pointer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease-out;
        }

        .pointer-arrow {
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 90px solid var(--accent-color);
            position: absolute;
            top: 30px;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
        }

        .kaaba-icon {
            position: absolute;
            top: 5px;
            font-size: 1.5rem;
        }

        .center-dot {
            width: 16px;
            height: 16px;
            background-color: var(--accent-color);
            border-radius: 50%;
            z-index: 10;
            border: 2px solid var(--bg-color);
        }

        .info-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            text-align: center;
            margin-top: 10px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }

        .info-box {
            flex: 1;
        }

        .info-title {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .btn-permission {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            display: none;
        }

        .footer {
            margin-top: auto;
            padding-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <a href="../" class="home-btn" title="Ana Sayfa">←</a>
        <button class="theme-icon-btn" onclick="toggleTheme()" id="theme-btn" title="Tema Değiştir">☀️</button>
    </div>

    <div class="header">
        <h1 data-i18n="header_title">Kıble Pusulası</h1>
        <p id="status-text" data-i18n="status_waiting">Konum ve pusula izni bekleniyor...</p>
    </div>

    <div class="compass-wrapper">
        <div class="compass-circle" id="compass">
            <span class="direction n" data-i18n="dir_n">K</span>
            <span class="direction e" data-i18n="dir_e">D</span>
            <span class="direction s" data-i18n="dir_s">G</span>
            <span class="direction w" data-i18n="dir_b">B</span>
        </div>
        <div class="qibla-pointer" id="qibla-pointer">
            <div class="kaaba-icon">🕋</div>
            <div class="pointer-arrow"></div>
        </div>
        <div class="center-dot"></div>
    </div>

    <button class="btn-permission" id="perm-btn" onclick="requestCompassPermission()" data-i18n="btn_permission">Pusulayı ve Sesi Etkinleştir</button>

    <div class="info-card">
        <div class="info-box">
            <div class="info-title" data-i18n="info_title">Kıble Açınız</div>
            <div class="info-value" id="qibla-angle">--°</div>
        </div>
        <div class="info-box" style="border-left: 1px solid var(--border-color);">
            <div class="info-title" data-i18n="info_distance_title">Kâbe'ye Mesafe</div>
            <div class="info-value" id="kaaba-distance">-- km</div>
        </div>
    </div>

    <div class="footer">
        <p data-i18n="footer_text">Ayetin Vakti • Titreşim & Ses Destekli</p>
    </div>
</div>

<script>
    // Dil Sözlüğü
    const translations = {
        tr: {
            page_title: "Kıble Pusulası | Ayetin Vakti",
            header_title: "Kıble Pusulası",
            status_waiting: "Konum ve pusula izni bekleniyor...",
            status_flat: "Cihazınızı düz tutun",
            status_aligned: "✨ Kıble Yönündesiniz ✨",
            status_no_location: "Konum alınamadı. Lütfen konum izni verin.",
            status_no_support: "Tarayıcınız konum özelliğini desteklemiyor.",
            status_sensor_err: "Pusulayı kullanabilmek için sensör izni vermeniz gerekmektedir.",
            btn_permission: "Pusulayı ve Sesi Etkinleştir",
            info_title: "Kıble Açınız",
            info_distance_title: "Kâbe'ye Mesafe",
            footer_text: "Ayetin Vakti • Titreşim & Ses Destekli",
            dir_n: "K", dir_e: "D", dir_s: "G", dir_w: "B"
        },
        en: {
            page_title: "Qibla Compass | Ayetin Vakti",
            header_title: "Qibla Compass",
            status_waiting: "Waiting for location and compass permission...",
            status_flat: "Keep your device flat",
            status_aligned: "✨ You are facing the Qibla ✨",
            status_no_location: "Could not get location. Please allow location access.",
            status_no_support: "Your browser does not support geolocation.",
            status_sensor_err: "Sensor permission is required to use the compass.",
            btn_permission: "Enable Compass & Audio",
            info_title: "Qibla Angle",
            info_distance_title: "Distance to Kaaba",
            footer_text: "Ayetin Vakti • Vibration & Audio Supported",
            dir_n: "N", dir_e: "E", dir_s: "S", dir_w: "W"
        },
        ar: {
            page_title: "بوصلة القبلة | آية الوقت",
            header_title: "بوصلة القبلة",
            status_waiting: "جاري انتظار إذن الموقع والبوصلة...",
            status_flat: "اجعل هاتفك مستوياً",
            status_aligned: "✨ أنت في اتجاه القبلة ✨",
            status_no_location: "تعذر الحصول على الموقع. يرجى السماح بالوصول للموقع.",
            status_no_support: "متصفحك لا يدعم خاصية تحديد الموقع.",
            status_sensor_err: "مطلوب إذن المستشعر لاستخدام البوصلة.",
            btn_permission: "تفعيل البوصلة والصوت",
            info_title: "اتجاه القبلة",
            info_distance_title: "المسافة إلى الكعبة",
            footer_text: "آية الوقت • يدعم الاهتزاز والصوت",
            dir_n: "ش", dir_e: "ق", dir_s: "ج", dir_w: "غ"
        }
    };

    let qiblaBearing = 0;
    let isAligned = false; 
    let audioCtx = null;

    const meccaLat = 21.4225;
    const meccaLng = 39.8262;

    // --- TEMA VE DİL BAŞLANGIÇ AYARLARI ---
    const themeBtn = document.getElementById('theme-btn');

    function updateThemeButton(isLight) {
        if (themeBtn) {
            themeBtn.textContent = isLight ? '☀️' : '🌙';
        }
    }

    function setTheme(isLight) {
        if (isLight) {
            document.documentElement.classList.add('light-mode');
            document.body.classList.add('light-mode');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.classList.remove('light-mode');
            document.body.classList.remove('light-mode');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeButton(isLight);
    }

    function toggleTheme() {
        const isLight = document.documentElement.classList.contains('light-mode');
        setTheme(!isLight);
    }

    // İlk yükleme tema durumu
    const savedThemeInitial = localStorage.getItem('theme');
    const systemPrefersDarkInitial = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isLightInitial = (savedThemeInitial === 'light') || (!savedThemeInitial && !systemPrefersDarkInitial);

    if (isLightInitial) {
        document.documentElement.classList.add('light-mode');
        document.body.classList.add('light-mode');
    } else {
        document.documentElement.classList.remove('light-mode');
        document.body.classList.remove('light-mode');
    }
    updateThemeButton(isLightInitial);

    // Web Audio API ile Dosyasız Bip Sesi Üretici
    function playBeep() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {
            console.log("Ses çalınamadı:", e);
        }
    }

    // Haversine Formülü ile Kâbe'ye Olan Mesafeyi Hesapla (km)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // Dünya'nın yarıçapı (km)
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
    }

    // Konum Bilgisi Al
    function initLocation() {
        const t = translations[currentLang] || translations['tr'];
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    qiblaBearing = calculateQiblaAngle(userLat, userLng);
                    const distanceToKaaba = calculateDistance(userLat, userLng, meccaLat, meccaLng);
                    
                    document.getElementById('qibla-angle').innerText = Math.round(qiblaBearing) + '°';
                    document.getElementById('kaaba-distance').innerText = distanceToKaaba.toLocaleString() + ' km';
                    document.getElementById('status-text').innerText = t.status_flat;

                    setupCompass();
                },
                (error) => {
                    document.getElementById('status-text').innerText = t.status_no_location;
                }
            );
        } else {
            document.getElementById('status-text').innerText = t.status_no_support;
        }
    }

    // Kıble Açısını Hesapla
    function calculateQiblaAngle(lat, lng) {
        const phiK = meccaLat * Math.PI / 180;
        const lambdaK = meccaLng * Math.PI / 180;
        const phi = lat * Math.PI / 180;
        const lambda = lng * Math.PI / 180;

        const qibla = Math.atan2(
            Math.sin(lambdaK - lambda),
            Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda)
        );

        return (qibla * 180 / Math.PI + 360) % 360;
    }

    // Pusula Sensörünü Başlat
    function setupCompass() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            document.getElementById('perm-btn').style.display = 'block';
        } else {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            window.addEventListener('deviceorientation', handleOrientation, true);
        }
    }

    function requestCompassPermission() {
        const t = translations[currentLang] || translations['tr'];
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    document.getElementById('perm-btn').style.display = 'none';
                    window.addEventListener('deviceorientation', handleOrientation, true);
                } else {
                    alert(t.status_sensor_err);
                }
            })
            .catch(console.error);
    }

    // Cihaz Döndükçe Pusulayı Kontrol Et
    function handleOrientation(event) {
        let heading = event.alpha;

        if (event.webkitCompassHeading) {
            heading = event.webkitCompassHeading;
        } else if (event.absolute && event.alpha !== null) {
            heading = 360 - event.alpha;
        }

        if (heading !== undefined && heading !== null) {
            document.getElementById('compass').style.transform = `rotate(${-heading}deg)`;
            
            const qiblaRotation = qiblaBearing - heading;
            document.getElementById('qibla-pointer').style.transform = `rotate(${qiblaRotation}deg)`;

            // Kıbleye Hizalanma Kontrolü
            let diff = Math.abs((heading - qiblaBearing + 360) % 360);
            if (diff > 180) diff = 360 - diff;

            const compassElem = document.getElementById('compass');
            const t = translations[currentLang] || translations['tr'];

            if (diff <= 4) {
                if (!isAligned) {
                    isAligned = true;
                    compassElem.classList.add('aligned');
                    document.getElementById('status-text').innerText = t.status_aligned;

                    if (navigator.vibrate) {
                        navigator.vibrate([150, 50, 150]);
                    }

                    playBeep();
                }
            } else {
                if (isAligned) {
                    isAligned = false;
                    compassElem.classList.remove('aligned');
                    document.getElementById('status-text').innerText = t.status_flat;
                }
            }
        }
    }

    window.onload = () => {
        // Dil metinlerini sayfaya uygulama
        if (translations[currentLang]) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    if (element.tagName === 'TITLE') {
                        document.title = translations[currentLang][key];
                    } else {
                        element.textContent = translations[currentLang][key];
                    }
                }
            });
        }

        initLocation();
    };
</script>

</body>
</html>
