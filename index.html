    <script>
        // Tema ve özel renk paleti (titremeyi önlemek için en başta çalışır)
        (function () {
            const d = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isLight = savedTheme === 'light' || (!savedTheme && !systemPrefersDark);
            if (isLight) {
                d.classList.add('light-mode');
            }
            const a = localStorage.getItem('custom_accent');
            const t = localStorage.getItem('custom_text');
            const b = localStorage.getItem('custom_bg');
            if (a) d.style.setProperty('--accent-color', a);
            if (t) d.style.setProperty('--text-color', t);
            if (b) {
                d.style.setProperty('--bg-color', b);
                d.style.setProperty('--card-bg', b);
            }
            // Özel arka plan var, yazı rengi seçilmemişse okunabilir renkleri zeminin açıklığına göre seç
            if (b && !t) {
                const m = /^#([0-9a-f]{6})$/i.exec(b.trim());
                if (m) {
                    const n = parseInt(m[1], 16);
                    const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
                    const L = 0.2126 * lin(n >> 16) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
                    const bgIsLight = L > 0.18;
                    d.style.setProperty('--text-color', bgIsLight ? '#0f172a' : '#f8fafc');
                    d.style.setProperty('--text-muted', bgIsLight ? '#475569' : '#cbd5e1');
                    d.style.setProperty('--border-color', bgIsLight ? 'rgba(15,23,42,0.18)' : 'rgba(248,250,252,0.22)');
                    // Buton zeminleri de zemine göre okunabilir kalsın
                    d.style.setProperty('--btn-bg', bgIsLight ? 'rgba(15,23,42,0.06)' : 'rgba(248,250,252,0.10)');
                    d.style.setProperty('--btn-hover', bgIsLight ? 'rgba(15,23,42,0.12)' : 'rgba(248,250,252,0.18)');
                }
            }
            // Safari/Chrome üst-alt çubuğu sayfa zeminine uysun
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', b || (isLight ? '#f8fafc' : '#0f172a'));

            // Dil ve yön
            const currentLang = localStorage.getItem('user_lang') || 'tr';
            d.setAttribute('lang', currentLang);
            d.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        })();
    </script>

        html, body, button, a, select, input, label, [onclick] { touch-action: manipulation; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            user-select: none;

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;

            flex-direction: column;
            align-items: center;
            padding: 16px;
            transition: background-color 0.3s ease, color 0.3s ease;

        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }

        .navbar { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; position: relative; }
        [dir="rtl"] .navbar { flex-direction: row-reverse; }

        .home-btn, .theme-icon-btn {
            background-color: var(--btn-bg); border: 1px solid var(--border-color); color: var(--text-color);
            width: 38px; height: 38px; border-radius: 50%; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; text-decoration: none;
        }
        @media (hover: hover) {
            .home-btn:hover, .theme-icon-btn:hover { background-color: var(--btn-hover); }

        .top-stats { width: 100%; display: flex; justify-content: space-between; padding: 0 15px; margin-bottom: 10px; }
        .stat-item { text-align: left; }
        .stat-item:last-child { text-align: right; }
        [dir="rtl"] .stat-item { text-align: right; }
        [dir="rtl"] .stat-item:last-child { text-align: left; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }

        .stat-value span { font-size: 0.9rem; color: var(--text-muted); font-weight: normal; }

        .compass-wrapper { position: relative; width: 290px; height: 290px; margin: 10px 0 15px 0; display: flex; justify-content: center; align-items: center; }

        .compass-bg-glow { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, var(--accent-color) 0%, rgba(0,0,0,0) 70%); opacity: 0.15; z-index: 0; }

        /* DÜZELTME: transform geçişi (transition) kaldırıldı; 359°→1° geçişinde ters yöne dönme sorunu giderildi */
        .compass-circle {
            width: 275px; height: 275px; border-radius: 50%; background-color: var(--card-bg); position: relative;
            box-shadow: var(--shadow), inset 0 0 15px rgba(0,0,0,0.3);
            transform: translateZ(0); will-change: transform; z-index: 1;
        }

        .compass-tick { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; margin-left: -1px; transform-origin: 50% 50%; pointer-events: none; }
        .compass-tick::before { content: ''; position: absolute; top: 6px; left: 0; width: 2px; height: 6px; background-color: var(--border-color); }
        .compass-tick.major::before { height: 11px; background-color: var(--text-muted); }

        .direction { position: absolute; font-weight: bold; font-size: 1rem; color: var(--text-muted); z-index: 2; }
        .direction.n { top: 18px; left: 50%; transform: translateX(-50%); color: #ef4444; }
        .direction.e { right: 20px; top: 50%; transform: translateY(-50%); }
        .direction.s { bottom: 18px; left: 50%; transform: translateX(-50%); }
        .direction.w { left: 20px; top: 50%; transform: translateY(-50%); }

        .compass-center-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 64px; height: 64px;
            background-color: var(--card-bg); border-radius: 50%; border: 2px solid var(--accent-color);

        .pointer-arrow {
            width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 95px solid var(--accent-color); position: absolute; top: 18px; filter: drop-shadow(0 0 6px var(--accent-color));
        }

        /* Cihazın ileri yönünü gösteren sabit işaret */
        .heading-marker { position: absolute; top: -2px; left: 50%; margin-left: -9px; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 14px solid var(--text-color); z-index: 12; opacity: .85; }

        .status-button-card {
            background-color: var(--btn-bg); border: 1px solid var(--border-color); color: var(--accent-color);

        .info-card {

        .decl-note { font-size: 0.72rem; color: var(--text-muted); line-height: 1.4; text-align: center; padding: 0 6px; }

        .btn-permission {

        .footer { margin-top: auto; padding-top: 15px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }

            status_calibrate: "دقة البوصلة منخفضة: حرّك الهاتف على شكل الرقم 8",
            btn_permission: "تفعيل البوصلة والصوت", btn_retry: "إعادة محاولة الموقع",

    };
    const lang = translations[localStorage.getItem('user_lang')] ? localStorage.getItem('user_lang') : 'tr';
    const t = translations[lang];

    // <PURE>
    const meccaLat = 21.4225, meccaLng = 39.8262;   // Kâbe koordinatları

    function calculateQiblaAngle(lat, lng) {
        const phiK = meccaLat * Math.PI / 180, lambdaK = meccaLng * Math.PI / 180;
        const phi = lat * Math.PI / 180, lambda = lng * Math.PI / 180;
        const q = Math.atan2(Math.sin(lambdaK - lambda), Math.cos(phi) * Math.tan(phiK) - Math.sin(phi) * Math.cos(lambdaK - lambda));
        return (q * 180 / Math.PI + 360) % 360;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371, rad = Math.PI / 180;
        const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) ** 2;
        return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // ---- Dünya Manyetik Modeli WMM2025: NOAA/NCEI + BGS katsayıları, NOAA'nın yayımladığı 12 resmî test değeriyle doğrulandı ----

            [1, 0, -29351.8, 0.0, 12.0, 0.0],
            [1, 1, -1410.8, 4545.4, 9.7, -21.5],
            [2, 0, -2556.6, 0.0, -11.6, 0.0],
            [2, 1, 2951.1, -3133.6, -5.2, -27.7],
            [2, 2, 1649.3, -815.1, -8.0, -12.1],
            [3, 0, 1361.0, 0.0, -1.3, 0.0],
            [3, 1, -2404.1, -56.6, -4.2, 4.0],

    // WMM2025 (NOAA/NCEI + BGS) ile manyetik sapma (D), derece, doğu pozitif. Geçerlilik: 2025.0 – 2030.0 (31 Aralık 2029'a kadar).
    function wmmField(latDeg, lonDeg, hKm, year) {
        const rad = Math.PI / 180, A = 6378.137, F = 1 / 298.257223563, E2 = F * (2 - F), RE = 6371.2, N = 12;
        const t = year - WMM2025.epoch;
        const phi = latDeg * rad, lam = lonDeg * rad, sp = Math.sin(phi), cp = Math.cos(phi);
        // jeodezik -> küresel
        const rc = A / Math.sqrt(1 - E2 * sp * sp);
        const p = (rc + hKm) * cp, z = (rc * (1 - E2) + hKm) * sp;
        const r = Math.sqrt(p * p + z * z), phiS = Math.asin(z / r);
        const ct = Math.sin(phiS), st = Math.cos(phiS);        // cos(kolatitüd), sin(kolatitüd)
        // Schmidt yarı-normalize Legendre ve kolatitüd türevi
        const P = [], dP = [];
        for (let n = 0; n <= N; n++) { P.push(new Array(N + 1).fill(0)); dP.push(new Array(N + 1).fill(0)); }
        P[0][0] = 1;
        for (let n = 1; n <= N; n++) {
            for (let m = 0; m <= n; m++) {
                if (n === m) {
                    if (n === 1) { P[1][1] = st; dP[1][1] = ct; }
                    else { const k = Math.sqrt((2 * n - 1) / (2 * n)); P[n][n] = k * st * P[n - 1][n - 1]; dP[n][n] = k * (ct * P[n - 1][n - 1] + st * dP[n - 1][n - 1]); }
                } else {
                    const d = Math.sqrt(n * n - m * m), k2 = n - 1 >= m ? Math.sqrt((n - 1) * (n - 1) - m * m) : 0;
                    const p2 = n - 2 >= m ? P[n - 2][m] : 0, dp2 = n - 2 >= m ? dP[n - 2][m] : 0;
                    P[n][m] = ((2 * n - 1) * ct * P[n - 1][m] - k2 * p2) / d;
                    dP[n][m] = ((2 * n - 1) * (ct * dP[n - 1][m] - st * P[n - 1][m]) - k2 * dp2) / d;
                }
            }
        }
        let br = 0, bt = 0, bl = 0;
        for (const c of WMM2025.coef) {
            const n = c[0], m = c[1], g = c[2] + t * c[4], h = c[3] + t * c[5];
            const ar = Math.pow(RE / r, n + 2), cm = Math.cos(m * lam), sm = Math.sin(m * lam);
            br += ar * (n + 1) * (g * cm + h * sm) * P[n][m];
            bt += ar * (g * cm + h * sm) * dP[n][m];
            bl += ar * m * (g * sm - h * cm) * P[n][m];
        }
        const xs = bt, ys = bl / st, zs = -br;                 // kuzey, doğu, aşağı (küresel)
        const dphi = phiS - phi, X = xs * Math.cos(dphi) - zs * Math.sin(dphi), Y = ys, Z = xs * Math.sin(dphi) + zs * Math.cos(dphi);
        const H = Math.sqrt(X * X + Y * Y);
        return { X, Y, Z, H, F: Math.sqrt(H * H + Z * Z), I: Math.atan2(Z, H) / rad, D: Math.atan2(Y, X) / rad };
    }
    function decimalYear(ms) {
        const d = new Date(ms), y = d.getUTCFullYear(), s = Date.UTC(y, 0, 1), e = Date.UTC(y + 1, 0, 1);
        return y + (ms - s) / (e - s);
    }
    // Model süresi dışında null döner (düzeltme uygulanmaz).
    function wmmDeclination(latDeg, lonDeg, ms) {
        const yr = decimalYear(ms);
        if (!(yr >= WMM2025.epoch && yr < WMM2025.validUntil)) return null;
        const D = wmmField(latDeg, lonDeg, 0, yr).D;
        return isFinite(D) ? D : null;
    }

    function angDiff(a, b) { let d = Math.abs(((a - b) % 360 + 360) % 360); return d > 180 ? 360 - d : d; }
    function unwrap(prev, target) { return prev + ((((target - prev) % 360) + 540) % 360 - 180); }

    // Mutlak yönelim (alpha,beta,gamma) -> MANYETİK yön. Telefon düz ya da dik tutulsa da çalışır.
    function headingFromAbsolute(alpha, beta, gamma) {
        const r = Math.PI / 180, z = (alpha || 0) * r, x = (beta || 0) * r, y = (gamma || 0) * r;
        const cX = Math.cos(x), cY = Math.cos(y), cZ = Math.cos(z), sX = Math.sin(x), sY = Math.sin(y), sZ = Math.sin(z);
        const yE = -cX * sZ, yN = cZ * cX, yU = sX;                       // cihazın üst kenarı
        const bE = -(cY * sZ * sX + cZ * sY), bN = -(sZ * sY - cZ * cY * sX);   // arka yüzün baktığı yön
        const useTop = Math.abs(yU) < 0.85;
        const h = Math.atan2(useTop ? yE : bE, useTop ? yN : bN) * 180 / Math.PI;
        return (h + 360) % 360;
    }
    // </PURE>

    // ===================== DURUM =====================
    let qiblaBearing = null, declAuto = 0, declKnown = false;
    let hx = 0, hy = 1, haveHeading = false, accuracy = null, needsRender = false;
    let dialAngle = 0, ptrAngle = 0, isAligned = false, compassStarted = false, audioCtx = null, wakeLock = null;
    let locSource = '-', locLat = null, locLng = null, sensorKind = 'yok', eventCount = 0, lastDiag = 0, staticQ = null, sensorTimer = null;

    // ===================== TEMA =====================
    function updateThemeButton() {
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = document.documentElement.classList.contains('light-mode') ? '☀️' : '🌙';
    }
    function updateThemeColor() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (!meta) return;
        const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim();
        if (bg) meta.setAttribute('content', bg);
    }
    function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light-mode');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
        updateThemeButton();
        updateThemeColor();
    }

    // ===================== SES / EKRAN =====================
    function unlockAudio() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) { /* ses desteklenmiyor */ }
    }
    function playBeep() {
        try {
            unlockAudio();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) { console.log('Ses çalınamadı:', e); }
    }
    async function keepAwake() {
        try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { /* desteklenmiyor */ }
    }

    // ===================== KONUM =====================
    function setStatus(text, aligned) {
        document.getElementById('status-text').textContent = text;
        document.getElementById('status-card').classList.toggle('aligned', !!aligned);
    }

    function applyLocation(lat, lng, noteText, source) {
        locSource = source || 'GPS'; locLat = lat; locLng = lng;
        qiblaBearing = calculateQiblaAngle(lat, lng);
        const dist = calculateDistance(lat, lng, meccaLat, meccaLng);
        document.getElementById('qibla-angle-top').textContent = Math.round(qiblaBearing) + '°';
        document.getElementById('kaaba-distance').textContent = dist.toLocaleString() + ' km';
        const d = wmmDeclination(lat, lng, Date.now());
        declKnown = d !== null; declAuto = declKnown ? d : 0;
        document.getElementById('decl-line').textContent = declKnown ? `${t.decl_label}: ${d >= 0 ? '+' : ''}${d.toFixed(1)}° (WMM2025)` : t.decl_none;
        document.getElementById('retry-btn').style.display = noteText ? 'block' : 'none';
        setStatus(noteText || (declKnown ? t.status_flat : t.decl_none), false);
        needsRender = true;
        setupCompass();
    }

    // Konum izni/servisi yoksa pusula KİLİTLİ kalır: sensör dinlenmez, ok çizilmez, Kıble hesaplanmaz.
    // (Kayıtlı şehre göre tahmin yapılmaz; konum olmadan gösterilen yön yanlış olabilir.)
    function lockCompass(msg) {
        window.removeEventListener('deviceorientationabsolute', handleOrientation, true);
        window.removeEventListener('deviceorientation', handleOrientation, true);
        clearTimeout(sensorTimer); sensorTimer = null;
        if (wakeLock) { try { wakeLock.release(); } catch (e) { /* yok say */ } wakeLock = null; }
        qiblaBearing = null; haveHeading = false; compassStarted = false; isAligned = false; needsRender = false;
        locLat = null; locLng = null; declAuto = 0; declKnown = false;
        document.getElementById('perm-btn').style.display = 'none';
        document.getElementById('qibla-angle-top').textContent = '--°';
        document.getElementById('current-angle').textContent = '--°';
        document.getElementById('current-dir-code').textContent = '--';
        document.getElementById('kaaba-distance').textContent = '-- km';
        document.getElementById('decl-line').textContent = '--';
        document.getElementById('compass-wrapper').classList.add('locked');
        document.getElementById('retry-btn').style.display = 'block';
        setStatus(msg, false);
    }

    function initLocation() {
        if (!navigator.geolocation) { lockCompass(t.status_no_support); return; }
        setStatus(t.status_waiting, false);
        navigator.geolocation.getCurrentPosition(
            pos => {
                document.getElementById('compass-wrapper').classList.remove('locked');
                applyLocation(pos.coords.latitude, pos.coords.longitude, '', 'GPS');
            },
            err => {
                const code = err && err.code;
                lockCompass(code === 1 ? t.status_denied : code === 2 ? t.status_unavailable : code === 3 ? t.status_timeout : t.status_no_location);
            },
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 0 }
        );
    }

    // İzin sonradan kapatılırsa pusula hemen kilitlenir; sonradan açılırsa yeniden denenir.
    function watchLocationPermission() {
        try {
            if (!navigator.permissions || !navigator.permissions.query) return;
            navigator.permissions.query({ name: 'geolocation' }).then(ps => {
                ps.onchange = () => {
                    if (ps.state === 'denied') lockCompass(t.status_denied);
                    else if (ps.state === 'granted' && qiblaBearing === null) initLocation();
                };
            }).catch(() => { /* desteklenmiyor */ });
        } catch (e) { /* desteklenmiyor */ }
    }

    // ===================== SENSÖR =====================
    function readMagneticHeading(e) {
        // iOS: doğrudan manyetik yön
        if (typeof e.webkitCompassHeading === 'number' && !isNaN(e.webkitCompassHeading)) {
            accuracy = (typeof e.webkitCompassAccuracy === 'number') ? e.webkitCompassAccuracy : null;
            sensorKind = 'iOS (webkitCompassHeading)';
            return e.webkitCompassHeading;
        }
        // Android/diğer: yalnızca MUTLAK yönelim kabul edilir (göreli alpha kuzeyi göstermez)
        if (e.alpha === null || e.alpha === undefined) return null;
        if (e.type === 'deviceorientationabsolute' || e.absolute === true) { sensorKind = 'mutlak yönelim (' + e.type + ')'; return headingFromAbsolute(e.alpha, e.beta, e.gamma); }
        return null;
    }

    function handleOrientation(e) {
        eventCount++;
        const h = readMagneticHeading(e);
        if (h === null || isNaN(h)) return;
        const r = h * Math.PI / 180;
        if (!haveHeading) { hx = Math.sin(r); hy = Math.cos(r); haveHeading = true; }
        else { const k = 0.3; hx += k * (Math.sin(r) - hx); hy += k * (Math.cos(r) - hy); }   // dairesel yumuşatma
        needsRender = true;
    }

    function setupCompass() {
        if (compassStarted) return;
        compassStarted = true;
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            document.getElementById('perm-btn').style.display = 'block';
        } else {
            startListening();
        }
    }

    function startListening() {
        if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
        keepAwake();
        // Birkaç saniyede veri gelmezse sensör yok demektir (ör. bilgisayar)
        clearTimeout(sensorTimer);
        sensorTimer = setTimeout(() => {
            if (!haveHeading && qiblaBearing !== null) setStatus(`${t.status_no_sensor} ${Math.round(qiblaBearing)}°`, false);
        }, 4000);
    }

    function requestCompassPermission() {
        if (qiblaBearing === null) return;   // konum yoksa pusula açılmaz
        unlockAudio();
        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') { document.getElementById('perm-btn').style.display = 'none'; startListening(); }
                else alert(t.status_sensor_err);
            })
            .catch(console.error);
    }

    // ===================== ÇİZİM DÖNGÜSÜ =====================
    function render() {
        requestAnimationFrame(render);
        if (!needsRender  ||   !haveHeading) return;
        needsRender = false;

        const magHeading = (Math.atan2(hx, hy) * 180 / Math.PI + 360) % 360;
        const heading = ((magHeading + declAuto) % 360 + 360) % 360;   // WMM2025 sapması eklenerek gerçek kuzeye göre yön

        document.getElementById('current-angle').textContent = Math.round(heading) + '°';
        document.getElementById('current-dir-code').textContent = t.dirs[Math.round(heading / 45) % 8];

        // DÜZELTME: açılar "açılarak" (unwrap) ilerler; 359°→1° geçişinde ters yöne dönmez
        dialAngle = unwrap(dialAngle, -heading);
        document.getElementById('compass').style.transform = `rotate(${dialAngle.toFixed(2)}deg)`;

        if (qiblaBearing === null) return;
        ptrAngle = unwrap(ptrAngle, qiblaBearing - heading);
        document.getElementById('qibla-pointer').style.transform = `rotate(${ptrAngle.toFixed(2)}deg)`;

        // DÜZELTME: eşik histerezisi (3° girişte, 6° çıkışta) — kenarda titreşip durmasın
        const diff = angDiff(heading, qiblaBearing);
        if (!declKnown) { if (isAligned) isAligned = false; return; }   // model geçerli değilse yön onayı verilmez
        if (!isAligned && diff <= 3) {
            isAligned = true;
            setStatus('✨ ' + t.status_aligned + ' ✨', true);
            if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
            playBeep();
        } else if (isAligned && diff > 6) {
            isAligned = false;
            setStatus(t.status_flat, false);
        } else if (!isAligned && accuracy !== null && (accuracy < 0 || accuracy > 25)) {
            setStatus(t.status_calibrate, false);
        } else if (!isAligned && document.getElementById('status-text').textContent === t.status_calibrate) {
            setStatus(t.status_flat, false);
        }
    }

    // ===================== BAŞLATMA =====================
    window.onload = () => {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) { if (el.tagName === 'TITLE') document.title = t[key]; else el.textContent = t[key]; }
        });
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (t[key]) { el.title = t[key]; el.setAttribute('aria-label', t[key]); }
        });
        document.title = t.page_title;
        updateThemeButton();
        updateThemeColor();

        // Kadran çizgileri (her 10°; 30°'nin katları uzun)
        let ticks = '';
        for (let d = 0; d < 360; d += 10) {
            if (d % 90 === 0) continue;
            ticks += `<div class="compass-tick${d % 30 === 0 ? ' major' : ''}" style="transform: rotate(${d}deg);"></div>`;
        }
        document.getElementById('compass').insertAdjacentHTML('afterbegin', ticks);

        document.addEventListener('pointerdown', unlockAudio, { once: true });
        document.addEventListener('visibilitychange', () => { if (!document.hidden && compassStarted) keepAwake(); });
        requestAnimationFrame(render);
        try { localStorage.removeItem('qibla_decl_on'); localStorage.removeItem('qibla_decl_adj'); } catch (e) { /* yok say */ }
        watchLocationPermission();
        initLocation();
    };
